<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <title>Icono MiVaro - Moderno 3D</title>
    <defs>
        <radialGradient id="bg-gradient" cx="50%" cy="0%" r="100%">
            <stop offset="0%" stop-color="#1F2937"/>
            <stop offset="100%" stop-color="#0B0F19"/>
        </radialGradient>
        
        <linearGradient id="grad-front" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5EEAD4"/> <stop offset="100%" stop-color="#2DD4BF"/> </linearGradient>

        <linearGradient id="grad-back" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#14B8A6"/>
            <stop offset="100%" stop-color="#042F2E"/>
        </linearGradient>

        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="15" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <rect width="1024" height="1024" rx="225" fill="url(#bg-gradient)"/>

    <g transform="translate(0, 20)">
        
        <path d="M 512 750 L 780 280" stroke="url(#grad-back)" stroke-width="140" stroke-linecap="round" />
        
        <path d="M 244 280 L 512 750" stroke="url(#grad-front)" stroke-width="140" stroke-linecap="round" filter="url(#drop-shadow)" />
        
        <circle cx="780" cy="280" r="70" fill="#5EEAD4" filter="url(#drop-shadow)" />
        
    </g>
</svg>
